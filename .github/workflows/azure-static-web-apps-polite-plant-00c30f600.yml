name: Frontend - build and deploy to Static Web Apps

# The filename matches the one Azure Static Web Apps generated when the repo was
# connected, because the deployment token secret it created is named after the
# same app slug: AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_PLANT_00C30F600. Keeping
# the name means that secret is already the one this workflow reads.
#
# The deploy step is deliberately the same shape as Azure's generated template,
# which is the configuration proven to work against this Static Web App. The one
# thing added is VITE_API_URL in the step environment: Vite inlines VITE_*
# variables at build time, and the deploy action passes its environment through
# to the build, so without it the bundle ships pointing at the wrong API host
# and every request fails CORS.
#
# DO NOT ADD `repo_token` TO THE DEPLOY STEP.
#
# It is the reason five consecutive runs failed with:
#   The content server has rejected the request with: BadRequest
#   Reason: No matching Static Web App was found or the api key was invalid.
#
# That message points at the deployment token, and it is misleading. Comparing
# the deploy step inputs across every run isolates it to one variable:
#
#   github_id_token   repo_token   result
#   yes               no           SUCCESS
#   no                yes          FAILURE
#   yes               yes          FAILURE   <- rules out github_id_token
#   no                yes          FAILURE
#
# Supplying `repo_token` switches the action off the deployment-token path and
# onto a GitHub-token path meant for creating deployments and pull request
# comments. The content server then validates the request differently and
# rejects it, whatever the deployment token is. The cost of leaving it out is
# that pull request previews get no comment with their URL; the deploy itself,
# including preview environments, is unaffected. Azure's own generated template
# does not pass it either.
#
# GitHub logs "Unexpected input(s) 'github_id_token'" because the input is not
# declared in the action's action.yml. It is advisory: the value still reaches
# the container as INPUT_GITHUB_ID_TOKEN, and the one successful run is the one
# that passed it. `skip_api_build` is genuinely unsupported - leave it out.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/azure-static-web-apps-polite-plant-00c30f600.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build and deploy
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest

    # Needed to mint the OIDC token the deploy step passes as github_id_token.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Static Web Apps needs the git history to label preview environments.
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Typecheck before handing the build to Azure. A type error surfaces here
      # in under a minute, instead of inside the deploy action's build container
      # where the log is much harder to read.
      - name: Install and typecheck
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

      # Fail early and loudly rather than shipping a frontend that calls the
      # wrong host. VITE_API_URL is not a secret - it is readable in the shipped
      # bundle - so it lives in repository variables, not secrets.
      - name: Require VITE_API_URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Repository variable VITE_API_URL is not set. Expected https://bivry-api-cmdwbrh7hxcshpca.australiacentral-01.azurewebsites.net/api"
            exit 1
          fi
          echo "VITE_API_URL = $VITE_API_URL"

      - name: Mint the OIDC token for the deploy
        uses: actions/github-script@v7
        id: idtoken
        with:
          # `core` is bundled with github-script, so unlike Azure's template
          # there is no `npm install @actions/core` step writing into the repo
          # root package.json on the runner.
          script: return await core.getIDToken()
          result-encoding: string

      # These inputs are exactly the set from the one run that succeeded, plus
      # VITE_API_URL in the environment. See the note at the top of this file
      # before adding anything else here, in particular repo_token.
      - name: Build and deploy to Azure Static Web Apps
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        env:
          # The action passes its environment into the build it runs, and Vite
          # inlines VITE_* at build time. Without this the bundle ships with no
          # API host and falls back to its own origin, where there is no API.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        with:
          # The generated secret stays as a fallback: resetting the deployment
          # token in the portal invalidates whichever value is older.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_PLANT_00C30F600 }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: upload
          app_location: frontend
          output_location: dist

  # Tears down the preview environment when a pull request is closed, so stale
  # preview URLs do not pile up.
  close_pull_request:
    name: Close preview environment
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          # Prefer the manually maintained secret, because resetting the
          # deployment token in the portal invalidates whatever Azure wrote into
          # the generated ..._POLITE_PLANT_00C30F600 secret when it connected the
          # repo. That is what "the api key was invalid" means here. The
          # generated one stays as a fallback for a fresh clone of this setup.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_PLANT_00C30F600 }}
          action: close
