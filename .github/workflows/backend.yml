name: Backend - build, migrate, deploy

# Only runs when something the API actually depends on changed.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'database/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  # The resource name, used by the deploy action.
  AZURE_WEBAPP_NAME: bivry-api
  # The public hostname, which is NOT just <name>.azurewebsites.net any more:
  # App Service now appends a random suffix and the region. Copy it from the
  # App Service Overview blade ("Default domain"). Defined once here so the
  # environment URL and the health check cannot drift apart.
  AZURE_WEBAPP_HOSTNAME: bivry-api-cmdwbrh7hxcshpca.australiacentral-01.azurewebsites.net

concurrency:
  # A newer push supersedes an in flight deploy instead of racing it.
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build and verify. Runs on pull requests too, so nothing broken reaches main.
  # ---------------------------------------------------------------------------
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` respects the lockfile exactly. `npm install` does not, which is
      # how a build passes locally and fails here.
      - name: Install dependencies
        run: npm ci

      # Must happen before tsc: the generated client is what provides the types.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # The database/ folder is generated from the schema. If a schema change
      # landed without regenerating it, the docs are already lying. Fail here.
      - name: Check database/ docs are in sync with the schema
        run: |
          node scripts/export-schema.mjs
          # `git status --porcelain` rather than `git diff`, so a generated file
          # that was never committed is caught too.
          changes=$(git status --porcelain -- ../database)
          if [ -n "$changes" ]; then
            echo "::error::database/ is out of date. Run 'npm run db:sql' and commit the result."
            echo "$changes"
            git diff -- ../database
            exit 1
          fi

      - name: Compile TypeScript
        run: npx tsc -p tsconfig.json

      # Stamps the build so /api/health can report which commit is running, and
      # the smoke test below can insist it is this one.
      - name: Stamp the build
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' \
            "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-info.json
          cat dist/build-info.json

      # Strip dev dependencies, then regenerate the Prisma client so the engine
      # binary and node_modules/.prisma survive into the artifact. `prisma` is a
      # runtime dependency precisely so it is still here after the prune.
      - name: Prepare production node_modules
        run: |
          npm prune --omit=dev
          npx prisma generate

      # Only what the server needs at runtime. `prisma/` is included so
      # `prisma migrate deploy` can also be run from the App Service SSH console
      # if a migration ever has to be applied by hand.
      #
      # Zipped rather than uploaded as a folder: node_modules is tens of
      # thousands of small files, and upload-artifact handles one big file far
      # faster than that.
      - name: Package deployment artifact
        run: zip -qry ../backend.zip dist node_modules prisma package.json package-lock.json

      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend.zip
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Migrate, then deploy. Migrations first: new code must never meet an old
  # schema. Keep every migration backwards compatible for one release so a
  # rollback of the app does not break against the already migrated database.
  # ---------------------------------------------------------------------------
  deploy:
    name: Migrate and deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_HOSTNAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Applies pending migrations only. It never generates a migration and
      # never resets data, so it is safe to run on every deploy.
      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: .

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend.zip

      # Three things have to be true before this deploy counts as done:
      #   1. the API answers at all (it did not crash on boot)
      #   2. it can reach the database
      #   3. the commit answering is THIS commit
      #
      # Without (3) the check passes against whatever was already running. A
      # deploy that uploads fine but never swaps the app then goes green while
      # serving the previous build, which has already happened here once.
      - name: Smoke test /api/health
        run: |
          url="https://${{ env.AZURE_WEBAPP_HOSTNAME }}/api/health"
          expected="${{ github.sha }}"
          echo "waiting for commit $expected to be live at $url"

          for attempt in $(seq 1 20); do
            body=$(curl -fsS --max-time 15 "$url" || true)
            echo "attempt $attempt: ${body:-no response}"

            commit=$(echo "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            database=$(echo "$body" | sed -n 's/.*"database":"\([^"]*\)".*/\1/p')

            if [ "$commit" = "$expected" ] && [ "$database" = "connected" ]; then
              echo "API is healthy and running $commit"
              exit 0
            fi

            [ -n "$commit" ] && [ "$commit" != "$expected" ] \
              && echo "  still serving $commit, waiting for the swap"

            sleep 15
          done

          echo "::error::API never reported commit $expected with a connected database within 5 minutes"
          exit 1

      # Separate from the gate above, and deliberately after it: mail being
      # broken should not stop the code shipping, but it must not pass quietly
      # either.
      #
      # Password reset is the only way back into an account. When SMTP is
      # misconfigured every layer still reports success - the forgot password
      # endpoint always does, because it must not reveal whether an address has
      # an account - so nothing surfaces until a user cannot get in and says so.
      # That is exactly how a wrong SMTP_USER sat unnoticed in this deployment.
      - name: Check password reset email can be delivered
        run: |
          body=$(curl -fsS --max-time 15 "https://${{ env.AZURE_WEBAPP_HOSTNAME }}/api/health" || true)

          verified=$(echo "$body" | sed -n 's/.*"transportVerified":\([a-z]*\).*/\1/p')
          reason=$(echo "$body"  | sed -n 's/.*"transportError":"\([^"]*\)".*/\1/p')
          domain=$(echo "$body"  | sed -n 's/.*"loginDomain":"\([^"]*\)".*/\1/p')
          sender=$(echo "$body"  | sed -n 's/.*"senderConfigured":\([a-z]*\).*/\1/p')

          echo "transportVerified=$verified transportError=${reason:-none} loginDomain=${domain:-none} senderConfigured=$sender"

          if [ "$verified" = "true" ] && [ "$sender" = "true" ]; then
            echo "password reset email is deliverable"
            exit 0
          fi

          case "$reason" in
            EAUTH|535)
              echo "::error::SMTP rejected the login (${reason}). SMTP_USER is currently a '${domain}' address; a provider relay usually wants its own generated login, not an account email. Check SMTP_USER and SMTP_PASSWORD in the App Service application settings." ;;
            ETIMEDOUT|ESOCKET|ECONNECTION|ECONNREFUSED)
              echo "::error::Could not open an SMTP connection (${reason}). Outbound SMTP may be blocked from the App Service, or SMTP_PORT is wrong. Port 25 is always blocked on Azure; use 587." ;;
            *)
              [ "$sender" != "true" ] \
                && echo "::error::MAIL_FROM is not set, so mail would be sent from a placeholder address that the provider accepts and then discards." \
                || echo "::error::Mail transport is not usable (${reason:-unknown})." ;;
          esac
          exit 1
